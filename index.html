<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 極速無極限 - 能量競技場</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        /* 核心美學變量 */
        :root {
            --primary: #00d4ff;
            --accent: #ff007f;
            --warning: #ffcc00;
            --bg-overlay: radial-gradient(circle at center, rgba(0,212,255,0.08) 0%, rgba(0,0,0,0.95) 100%);
            --card-bg: rgba(15, 15, 15, 0.7);
            --glass: rgba(255, 255, 255, 0.08);
            --glass-active: rgba(255, 255, 255, 0.2);
            --text-main: #ffffff;
            --text-dim: #999999;
            --card-border: rgba(0, 212, 255, 0.3); /* 強化邊框科技感 */
            --touch-bg: rgba(255, 255, 255, 0.1);
        }

        body.theme-light {
            --bg-overlay: radial-gradient(circle at center, rgba(255,255,255,0.9) 0%, rgba(200,220,240,0.95) 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --glass: rgba(0, 0, 0, 0.08); 
            --glass-active: rgba(0, 0, 0, 0.15);
            --text-main: #111111;
            --text-dim: #555555;
            --card-border: rgba(0, 212, 255, 0.5);
            --touch-bg: rgba(0, 0, 0, 0.12);
        }

        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif; background: #000; color: var(--text-main); touch-action: none; transition: background 0.5s, color 0.5s; }
        canvas { display: block; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* 啟動畫面 */
        #splash-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 2000;
            transition: opacity 0.8s ease-in-out; pointer-events: auto;
        }
        .splash-content { text-align: center; }
        .splash-text { font-size: 1.1rem; font-weight: 300; letter-spacing: 6px; color: #777; opacity: 0; animation: fadeInOut 3s forwards; text-transform: uppercase; }
        .splash-brand {
            font-size: 2.2rem; font-weight: 900; color: #fff; margin-top: 12px;
            opacity: 0; animation: fadeInOut 3s forwards; animation-delay: 0.2s;
            text-shadow: 0 0 40px rgba(0,212,255,0.8);
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(15px) scale(0.95); }
            25% { opacity: 1; transform: translateY(0) scale(1); }
            75% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-15px) scale(1.05); }
        }

        /* 通用選單樣式 (毛玻璃升級) */
        .overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--bg-overlay);
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center; pointer-events: auto; z-index: 100;
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            transition: opacity 0.5s ease-out, background 0.5s;
        }
        .menu-card { 
            background: var(--card-bg); padding: 45px; border-radius: 30px; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), inset 0 0 20px rgba(0,212,255,0.1); 
            text-align: center; max-width: 600px; width: 85%; border: 1px solid var(--card-border);
            position: relative; overflow: hidden;
            animation: cardEntrance 0.7s cubic-bezier(0.2, 1.2, 0.3, 1);
        }
        /* 卡片掃光特效 */
        .menu-card::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.05), transparent);
            transform: rotate(45deg) translateY(-100%); transition: 0.5s; pointer-events: none;
            animation: sweepLight 6s infinite;
        }
        @keyframes sweepLight {
            0% { transform: rotate(45deg) translateY(-100%); }
            20% { transform: rotate(45deg) translateY(100%); }
            100% { transform: rotate(45deg) translateY(100%); }
        }
        @keyframes cardEntrance {
            from { opacity: 0; transform: scale(0.85) translateY(40px); filter: blur(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }
        
        h1 { font-size: 3.2rem; margin: 0; color: var(--text-main); font-weight: 900; text-transform: uppercase; letter-spacing: -1px; line-height: 1; }
        h1 span { color: var(--primary); text-shadow: 0 0 25px rgba(0,212,255,0.6); }
        
        .section-label { margin: 25px 0 12px; font-weight: 800; color: var(--text-dim); text-transform: uppercase; font-size: 0.75rem; letter-spacing: 4px; }
        .options-group { margin-bottom: 15px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        
        .btn { 
            background: var(--glass); color: var(--text-main); border: 1px solid rgba(255,255,255,0.1); padding: 12px 24px; 
            cursor: pointer; border-radius: 14px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); font-size: 0.9rem; font-weight: 600;
        }
        .btn:hover { background: var(--glass-active); transform: translateY(-3px); border-color: var(--primary); box-shadow: 0 5px 15px rgba(0,212,255,0.2); }
        .btn.active { background: var(--primary); color: #000; font-weight: 800; border-color: #fff; box-shadow: 0 8px 25px rgba(0,212,255,0.5); transform: translateY(-2px); }
        
        .color-dot { width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); cursor: pointer; transition: 0.3s cubic-bezier(0.2, 1.2, 0.3, 1); }
        .color-dot.active { border-color: #fff; transform: scale(1.3); box-shadow: 0 0 20px var(--primary), inset 0 0 10px rgba(255,255,255,0.5); }
        
        /* 開始按鈕呼吸特效 */
        .start-btn { 
            background: var(--text-main); color: var(--card-bg); padding: 18px 70px; font-size: 1.4rem; 
            border: none; border-radius: 100px; cursor: pointer; margin-top: 35px; font-weight: 900; 
            transition: all 0.3s; letter-spacing: 2px;
            animation: pulseGlow 2s infinite alternate; /* 加入呼吸光 */
        }
        .start-btn:hover { background: var(--primary); color: #000; transform: translateY(-4px) scale(1.05); animation: none; box-shadow: 0 15px 40px rgba(0,212,255,0.6); }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px rgba(255,255,255,0.1); }
            100% { box-shadow: 0 0 25px rgba(255,255,255,0.5); }
        }

        .version-tag { position: absolute; bottom: 15px; right: 25px; font-size: 0.7rem; color: var(--text-dim); font-weight: 900; opacity: 0.5; }

        #settings-overlay { display: none; z-index: 1200; }
        .setting-row { margin-bottom: 22px; width: 100%; }
        .setting-row label { display: block; font-size: 0.75rem; color: var(--text-dim); margin-bottom: 10px; text-transform: uppercase; text-align: left; font-weight: 700; }
        .slider-container { display: flex; align-items: center; width: 100%; }
        input[type="range"] { flex: 1; -webkit-appearance: none; background: var(--glass); height: 8px; border-radius: 10px; outline: none; border: 1px solid rgba(255,255,255,0.1); }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; background: var(--primary); border-radius: 50%; cursor: pointer; border: 4px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.4); transition: 0.2s; }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

        /* HUD 組件動畫升級 - 初始狀態隱藏並偏移 */
        .hud-element { 
            opacity: 0; pointer-events: none; position: absolute;
            transition: opacity 0.6s ease-out, transform 0.8s cubic-bezier(0.2, 1, 0.3, 1);
        }
        
        /* 利用 .show 類別來控制滑入 */
        .hud-element.show { opacity: 1; transform: translate(0, 0) scale(1) !important; }

        /* 儀表板設計優化 */
        .radar { top: 25px; left: 25px; width: 180px; height: 180px; background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.1); border-radius: 50%; overflow: hidden; backdrop-filter: blur(15px); box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,212,255,0.1); transform: scale(0.5); /* 初始縮小 */ }
        .compass { top: 25px; right: 25px; width: 80px; height: 80px; transform: translateY(-50px); /* 初始往上移 */ }

        body.pc-mode:not(.mode-1p) .p1-radar { top: 25px; left: 25px; }
        body.pc-mode:not(.mode-1p) .p1-compass { top: 25px; left: calc(50% - 105px); right: auto; }
        body.pc-mode:not(.mode-1p) .p2-radar { top: 25px; right: 25px; left: auto; }
        body.pc-mode:not(.mode-1p) .p2-compass { top: 25px; right: calc(50% - 105px); left: auto; }

        .player-hud { bottom: 35px; display: flex; flex-direction: column; gap: 12px; transform: translateY(80px); /* 初始往下移 */ }
        .p1-hud { left: 40px; }
        .p2-hud { right: 40px; text-align: right; }
        
        .panel { background: rgba(0,0,0,0.65); padding: 15px 25px; border-radius: 20px; backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .speed-val { font-size: 3.5rem; font-weight: 900; color: var(--primary); line-height: 0.9; font-variant-numeric: tabular-nums; text-shadow: 0 0 15px rgba(0,212,255,0.4); }
        .obj-count { font-size: 2rem; font-weight: 900; color: var(--accent); text-shadow: 0 0 15px rgba(255,0,127,0.4); }

        .compass svg { width: 100%; height: 100%; filter: drop-shadow(0 0 15px var(--accent)); }
        
        /* 雷達點動畫升級 */
        .radar-dot { position: absolute; width: 10px; height: 10px; border-radius: 50%; transform: translate(-50%, -50%); transition: left 0.1s, top 0.1s; }
        .radar-dot.self { background: var(--primary); z-index: 5; box-shadow: 0 0 15px var(--primary); border: 2px solid #fff; }
        .radar-dot.other { background: var(--accent); z-index: 4; border: 1px solid #fff; }
        /* 目標點擴散波紋 */
        .radar-dot.target { 
            background: #fff; z-index: 3; 
        }
        .radar-dot.target::after {
            content: ''; position: absolute; top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 50%; border: 2px solid #fff;
            animation: radarRipple 1.5s infinite ease-out;
        }
        @keyframes radarRipple {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }

        .icon-btn { position: absolute; top: 25px; width: 50px; height: 50px; background: rgba(0,0,0,0.6); border-radius: 16px; display: flex; justify-content: center; align-items: center; cursor: pointer; pointer-events: auto; border: 1px solid rgba(255,255,255,0.1); z-index: 800; font-size: 1.4rem; transform: translateY(-50px); /* 初始往上 */ backdrop-filter: blur(10px); }
        .icon-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--primary); transform: translateY(-3px) !important; /* 覆蓋 show 狀態 */ }
        /* 使用 left 定位，並在 show 時重置 translateY */
        #audio-btn { left: calc(50% - 60px); }
        #settings-btn { left: calc(50% + 10px); }
        /* 針對 icon-btn 的 show 狀態特別處理，保留 translateX 如果有的話，但這裡改用 calc 計算 left 就不需要 translateX 了 */

        body.pe-mode .radar { width: 130px; height: 130px; top: 15px; left: 15px; }
        body.pe-mode .compass { width: 55px; height: 55px; top: 15px; right: 15px; left: auto; }
        body.pe-mode .player-hud { bottom: auto; top: 160px; }
        body.pe-mode .p1-hud { left: 15px; }
        body.pe-mode .p2-hud { right: 15px; }
        body.pe-mode .icon-btn { top: auto; bottom: 210px; width: 45px; height: 45px; }
        
        .mobile-controls-wrapper { position: absolute; bottom: 30px; width: 100%; height: 160px; display: none; justify-content: space-between; padding: 0 15px; box-sizing: border-box; z-index: 500; transform: translateY(100px); /* 初始往下 */ pointer-events: none; }
        .ctrl-group { display: flex; gap: 12px; align-items: flex-end; pointer-events: auto; }
        .touch-btn { width: 65px; height: 65px; background: var(--touch-bg); border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; display: flex; justify-content: center; align-items: center; font-weight: 900; font-size: 1.3rem; color: var(--text-main); user-select: none; -webkit-tap-highlight-color: transparent; backdrop-filter: blur(15px); transition: 0.1s; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .touch-btn:active { background: var(--primary); color: #000; transform: scale(0.85); box-shadow: 0 0 30px var(--primary); border-color: #fff; }
        .touch-btn.accel { background: rgba(0,212,255,0.15); height: 85px; width: 85px; border-color: var(--primary); }

        body.mode-1p .ctrl-p2 { display: none !important; }
        body.mode-1p .mobile-controls-wrapper { justify-content: space-around; padding: 0 30px; }

        #warning-box { position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%) scale(0.5); background: rgba(255, 0, 50, 0.9); color: white; padding: 20px 40px; border-radius: 25px; font-weight: 900; display: none; z-index: 1000; border: 3px solid white; text-align: center; box-shadow: 0 0 50px rgba(255,0,0,0.8); opacity: 0; transition: all 0.3s cubic-bezier(0.2, 1.5, 0.5, 1); }
        #warning-box.show-warn { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); animation: shake 0.4s infinite; }
        @keyframes shake { 0%, 100% { transform: translate(-50%, -50%) rotate(0deg); } 25% { transform: translate(-52%, -50%) rotate(-2deg); } 75% { transform: translate(-48%, -50%) rotate(2deg); } }
        
        .esc-tip { left: 50%; margin-left: -70px; font-size: 0.8rem; color: var(--text-dim); top: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; transform: translateY(-30px); background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 10px; }
        .divider { left: 50%; top: 0; width: 3px; height: 100%; background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.5), transparent); transform: translateX(-50%); display: none; opacity: 0; transition: opacity 1s; }
    </style>
</head>
<body class="pc-mode mode-1p">

<div id="ui-layer">
    <div id="splash-screen">
        <div class="splash-content">
            <div class="splash-text">NEXT-GEN RENDERING ENABLED</div>
            <div class="splash-brand">SPEED ARENA 3.0</div>
        </div>
    </div>

    <div id="start-menu" class="overlay" style="display: none; opacity: 0;">
        <div class="menu-card">
            <h1>SPEED <span>ARENA</span></h1>
            <p style="color: var(--text-dim); font-size: 0.85rem; margin-top:10px; font-weight: 600;">PHYSICALLY BASED RENDERING | DYNAMIC SHADOWS</p>
            
            <div class="section-label">RACE MODE</div>
            <div class="options-group">
                <button class="btn active" id="mode-1p" onclick="setMode(1)">人機競速</button>
                <button class="btn" id="mode-2p" onclick="setMode(2)">雙人對決</button>
                <button class="btn" id="mode-spec" onclick="setMode(3)">巔峰觀賽</button>
            </div>

            <div style="display: flex; justify-content: center; gap: 50px; margin-top: 20px;">
                <div>
                    <div class="section-label">P1 NEON</div>
                    <div class="options-group" id="p1-colors"></div>
                </div>
                <div>
                    <div class="section-label" id="p2-label">P2/AI NEON</div>
                    <div class="options-group" id="p2-colors"></div>
                </div>
            </div>

            <div class="section-label">GOAL TARGET</div>
            <div class="options-group" id="diff-opts">
                <button class="btn" onclick="setGoal(5)">5 核心</button>
                <button class="btn active" onclick="setGoal(10)">10 核心</button>
                <button class="btn" onclick="setGoal(20)">20 核心</button>
            </div>

            <button class="start-btn" onclick="startGame()">ENTER WORLD</button>
            <div style="margin-top:20px;"><button class="btn" style="padding: 10px 30px; font-size: 0.8rem; opacity: 0.7;" onclick="openSettings()">系統設定</button></div>
            
            <div class="version-tag">Engine v3.0 PBR</div>
        </div>
    </div>

    <div id="settings-overlay" class="overlay">
        <div class="menu-card settings-card">
            <h2 style="margin-top:0; letter-spacing: 5px; font-weight: 900; color: var(--primary);">SETTINGS</h2>
            
            <div class="setting-row">
                <label>介面主題 Theme</label>
                <div class="options-group">
                    <button class="btn active" id="theme-dark-btn" onclick="setTheme('dark')">深色霓虹</button>
                    <button class="btn" id="theme-light-btn" onclick="setTheme('light')">清爽明亮</button>
                </div>
            </div>

            <div class="setting-row">
                <label>主音量 Master</label>
                <div class="slider-container"><input type="range" id="vol-master" min="0" max="1" step="0.01" value="0.8" oninput="updateAudioSettings()"></div>
            </div>
            <div class="setting-row">
                <label>引擎音效 Engine</label>
                <div class="slider-container"><input type="range" id="vol-engine" min="0" max="1" step="0.01" value="0.5" oninput="updateAudioSettings()"></div>
            </div>
            <div class="setting-row">
                <label>環境音樂 BGM</label>
                <div class="slider-container"><input type="range" id="vol-bgm" min="0" max="1" step="0.01" value="0.3" oninput="updateAudioSettings()"></div>
            </div>
            
            <button class="start-btn" style="padding:15px 50px; font-size:1.1rem; margin-top:15px; animation: none;" onclick="closeSettings()">套用設定</button>
        </div>
    </div>

    <div id="audio-btn" class="icon-btn hud-element" onclick="toggleMute()">🔊</div>
    <div id="settings-btn" class="icon-btn hud-element" onclick="openSettings()">⚙️</div>

    <div id="win-screen" class="overlay" style="display: none;">
        <div class="menu-card">
            <h1 id="win-title">RACE FINISHED</h1>
            <p id="win-msg" style="margin: 30px 0; font-size: 1.2rem; white-space: pre-wrap; line-height: 1.8; color: var(--text-main); font-weight: 600;"></p>
            <button class="start-btn" onclick="returnToMenu()">返回中樞</button>
        </div>
    </div>

    <div id="p1-nav" class="compass p1-compass hud-element"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="2" opacity="0.2" /><path d="M50 10 L65 45 L50 38 L35 45 Z" id="p1-arrow-path" /></svg></div>
    <div id="p2-nav" class="compass p2-compass hud-element"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="2" opacity="0.2" /><path d="M50 10 L65 45 L50 38 L35 45 Z" id="p2-arrow-path" /></svg></div>

    <div id="p1-radar-ui" class="radar p1-radar hud-element"><div id="p1-radar-target" class="radar-dot target"></div><div id="p1-radar-other" class="radar-dot other"></div><div id="p1-radar-self" class="radar-dot self"></div></div>
    <div id="p2-radar-ui" class="radar p2-radar hud-element"><div id="p2-radar-target" class="radar-dot target"></div><div id="p2-radar-other" class="radar-dot other"></div><div id="p2-radar-self" class="radar-dot self"></div></div>

    <div id="p1-hud" class="player-hud p1-hud hud-element">
        <div class="panel"><div class="speed-val" id="p1-speed">0</div><div style="font-size:0.65rem; opacity:0.8; font-weight: 800; letter-spacing: 2px;">KM/H</div></div>
        <div class="panel"><div class="obj-count"><span id="p1-collected">0</span> / <span id="p1-total">10</span></div></div>
    </div>
    <div id="p2-hud" class="player-hud p2-hud hud-element">
        <div class="panel"><div class="speed-val" id="p2-speed">0</div><div style="font-size:0.65rem; opacity:0.8; font-weight: 800; letter-spacing: 2px;">P2 KM/H</div></div>
        <div class="panel"><div class="obj-count"><span id="p2-collected">0</span> / <span id="p2-total">10</span></div></div>
    </div>

    <div id="mobile-controls-wrapper" class="mobile-controls-wrapper hud-element">
        <div class="ctrl-p1" style="display: flex; gap: 40px;">
            <div class="ctrl-group"><div class="touch-btn" id="p1-btn-left">←</div><div class="touch-btn" id="p1-btn-right">→</div></div>
            <div class="ctrl-group"><div class="touch-btn" id="p1-btn-down">B</div><div class="touch-btn accel" id="p1-btn-up">GAS</div></div>
        </div>
        <div class="ctrl-p2" style="display: flex; gap: 40px;">
            <div class="ctrl-group"><div class="touch-btn" id="p2-btn-left">←</div><div class="touch-btn" id="p2-btn-right">→</div></div>
            <div class="ctrl-group"><div class="touch-btn" id="p2-btn-down">B</div><div class="touch-btn accel" id="p2-btn-up">GAS</div></div>
        </div>
    </div>

    <div id="warning-box"><div>⚠️ 邊界警報 ⚠️</div><div id="warn-timer">3</div> 秒後強制回傳</div>
    <div id="divider" class="divider hud-element"></div>
    <div class="esc-tip hud-element" id="esc-ui-tip">ESC 返回中樞</div>
</div>

<script>
    // 常數
    const COLORS = [0x00d4ff, 0xff007f, 0x00ff7f, 0xffcc00, 0xffffff, 0x8800ff];
    const WORLD_LIMIT = 4500;

    // 全域狀態
    let scene, renderer, clock = new THREE.Clock();
    let p1, p2, checkpoints = [];
    let gameMode = 1, goalCount = 10, p1Color = COLORS[0], p2Color = COLORS[1];
    let gameRunning = false, isFinished = false, startTime = 0;
    const keys = {};

    // 裝置偵測
    const isPE = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || ('ontouchstart' in window);
    if (isPE) document.body.classList.replace('pc-mode', 'pe-mode');

    // 設置與主題管理
    const PersistedSettings = {
        master: 0.8, bgm: 0.3, engine: 0.5, sfx: 0.6, muted: false, theme: 'dark',
        load() {
            const data = JSON.parse(sessionStorage.getItem('racing_settings_v3') || '{}');
            if (data.master !== undefined) this.master = data.master;
            if (data.bgm !== undefined) this.bgm = data.bgm;
            if (data.engine !== undefined) this.engine = data.engine;
            if (data.theme !== undefined) this.theme = data.theme;
            if (data.muted !== undefined) this.muted = data.muted;
            
            document.getElementById('vol-master').value = this.master;
            document.getElementById('vol-bgm').value = this.bgm;
            document.getElementById('vol-engine').value = this.engine;
            setTheme(this.theme, false);
        },
        save() {
            this.master = parseFloat(document.getElementById('vol-master').value);
            this.bgm = parseFloat(document.getElementById('vol-bgm').value);
            this.engine = parseFloat(document.getElementById('vol-engine').value);
            sessionStorage.setItem('racing_settings_v3', JSON.stringify(this));
        }
    };

    function setTheme(t, shouldSave = true) {
        PersistedSettings.theme = t;
        if (t === 'light') document.body.classList.add('theme-light');
        else document.body.classList.remove('theme-light');
        document.getElementById('theme-dark-btn').classList.toggle('active', t === 'dark');
        document.getElementById('theme-light-btn').classList.toggle('active', t === 'light');
        if (shouldSave) PersistedSettings.save();
    }

    // 音頻引擎 (保持不變)
    const AudioEngine = {
        ctx: null, masterGain: null, bgmGain: null, engineGain: null, p1Engine: null, p2Engine: null,
        init() {
            if (this.ctx) return;
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.masterGain = this.ctx.createGain(); this.masterGain.connect(this.ctx.destination);
            this.bgmGain = this.ctx.createGain(); this.bgmGain.connect(this.masterGain);
            this.engineGain = this.ctx.createGain(); this.engineGain.connect(this.masterGain);
            this.p1Engine = this.createCarEngine(); this.p2Engine = this.createCarEngine();
            this.createBGM(); this.applySettings();
        },
        createCarEngine() {
            const group = this.ctx.createGain(); group.connect(this.engineGain); group.gain.value = 0;
            const filter = this.ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.Q.value = 8; filter.connect(group);
            const osc1 = this.ctx.createOscillator(); osc1.type = 'sawtooth'; osc1.connect(filter); osc1.start();
            const osc2 = this.ctx.createOscillator(); osc2.type = 'square'; osc2.connect(filter); osc2.start();
            return { osc1, osc2, filter, gain: group };
        },
        updateEngine(engine, speed) {
            if (!this.ctx) return;
            const absSpeed = Math.abs(speed);
            const rpm = 35 + absSpeed * 1.8 + (Math.random() * 2);
            engine.osc1.frequency.setTargetAtTime(rpm, this.ctx.currentTime, 0.05);
            engine.osc2.frequency.setTargetAtTime(rpm * 0.51, this.ctx.currentTime, 0.05);
            engine.filter.frequency.setTargetAtTime(200 + absSpeed * 22, this.ctx.currentTime, 0.1);
            engine.gain.gain.setTargetAtTime(Math.min(0.8, absSpeed/100 + 0.08), this.ctx.currentTime, 0.1);
        },
        createBGM() {
            setInterval(() => {
                if (!this.ctx || PersistedSettings.muted || !gameRunning) return;
                const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
                o.type = 'triangle'; o.frequency.setValueAtTime(50, this.ctx.currentTime);
                o.frequency.exponentialRampToValueAtTime(20, this.ctx.currentTime + 0.4);
                g.gain.setValueAtTime(0.08, this.ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.4);
                o.connect(g); g.connect(this.bgmGain); o.start(); o.stop(this.ctx.currentTime + 0.4);
            }, 650);
        },
        playCollectSFX() {
            if (!this.ctx || PersistedSettings.muted) return;
            const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
            o.type = 'sine'; o.frequency.setValueAtTime(1000, this.ctx.currentTime);
            o.frequency.exponentialRampToValueAtTime(2000, this.ctx.currentTime + 0.1);
            g.gain.setValueAtTime(0.2, this.ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
            o.connect(g); o.start(); o.stop(this.ctx.currentTime + 0.2);
        },
        applySettings() {
            if (!this.masterGain) return;
            this.masterGain.gain.setTargetAtTime(PersistedSettings.muted ? 0 : PersistedSettings.master, this.ctx.currentTime, 0.1);
            this.bgmGain.gain.setTargetAtTime(PersistedSettings.bgm, this.ctx.currentTime, 0.1);
            this.engineGain.gain.setTargetAtTime(PersistedSettings.engine, this.ctx.currentTime, 0.1);
        }
    };

    function updateAudioSettings() { PersistedSettings.save(); AudioEngine.applySettings(); }
    function toggleMute() { PersistedSettings.muted = !PersistedSettings.muted; document.getElementById('audio-btn').innerText = PersistedSettings.muted ? "🔇" : "🔊"; AudioEngine.applySettings(); PersistedSettings.save(); }
    function openSettings() { document.getElementById('settings-overlay').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settings-overlay').style.display = 'none'; }

    // 初始化與事件
    window.addEventListener('DOMContentLoaded', () => {
        PersistedSettings.load();
        const splash = document.getElementById('splash-screen');
        const menu = document.getElementById('start-menu');
        initUI();
        setTimeout(() => {
            splash.style.opacity = '0';
            setTimeout(() => { splash.style.display = 'none'; menu.style.display = 'flex'; requestAnimationFrame(() => { menu.style.opacity = '1'; }); }, 500); 
        }, 3000);
        if (isPE) setupMobileEvents();
    });

    function setupMobileEvents() {
        const bind = (id, k) => {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[k] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[k] = false; });
        };
        bind('p1-btn-up', 'KeyW'); bind('p1-btn-down', 'KeyS'); bind('p1-btn-left', 'KeyA'); bind('p1-btn-right', 'KeyD');
        bind('p2-btn-up', 'ArrowUp'); bind('p2-btn-down', 'ArrowDown'); bind('p2-btn-left', 'ArrowLeft'); bind('p2-btn-right', 'ArrowRight');
    }

    window.addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Escape' && gameRunning) returnToMenu(); });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    function initUI() {
        const p1G = document.getElementById('p1-colors'), p2G = document.getElementById('p2-colors');
        p1G.innerHTML = ""; p2G.innerHTML = "";
        COLORS.forEach((c, i) => {
            p1G.appendChild(createDot(c, i === 0, (color) => { p1Color = color; updateDots(p1G, color); }));
            p2G.appendChild(createDot(c, i === 1, (color) => { p2Color = color; updateDots(p2G, color); }));
        });
    }
    function createDot(color, isActive, callback) {
        const dot = document.createElement('div');
        dot.className = `color-dot ${isActive ? 'active' : ''}`;
        dot.style.backgroundColor = '#' + color.toString(16).padStart(6, '0');
        dot.onclick = () => callback(color);
        return dot;
    }
    function updateDots(container, color) {
        container.querySelectorAll('.color-dot').forEach(d => {
            const hex = hexToRgb(color);
            d.className = d.style.backgroundColor === hex ? 'color-dot active' : 'color-dot';
        });
    }
    function hexToRgb(hex) { const r = (hex >> 16) & 255, g = (hex >> 8) & 255, b = hex & 255; return `rgb(${r}, ${g}, ${b})`; }

    function setMode(m) {
        gameMode = m;
        document.querySelectorAll('.options-group .btn').forEach(b => b.id && b.id.includes('mode') && b.classList.remove('active'));
        document.getElementById(['mode-1p','mode-2p','mode-spec'][m-1]).classList.add('active');
        if (m === 1) document.body.classList.add('mode-1p'); else document.body.classList.remove('mode-1p');
    }
    function setGoal(n) { 
        goalCount = n; 
        document.querySelectorAll('#diff-opts .btn').forEach(b => b.classList.toggle('active', parseInt(b.innerText) === n));
    }

    // --- Three.js 光影核心升級 ---
    function initGame() {
        if (renderer) { renderer.dispose(); if (renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement); }
        scene = new THREE.Scene(); 
        scene.background = new THREE.Color(PersistedSettings.theme === 'light' ? 0xe0e8f0 : 0x050505);
        scene.fog = new THREE.Fog(scene.background, 500, 4500);

        // 升級渲染器設定 (開啟陰影與 Tone Mapping)
        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.autoClear = false;
        renderer.shadowMap.enabled = true; // 開啟陰影
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; // 柔和陰影
        renderer.toneMapping = THREE.ACESFilmicToneMapping; // 電影級色彩映射
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // 燈光系統升級
        scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.4)); // 基礎環境光
        
        // 主光源 (稍微帶有角度，提供基礎立體感，主要陰影由車底的 PointLight 提供以節省效能)
        const sun = new THREE.DirectionalLight(0xffffff, 0.8); 
        sun.position.set(500, 1000, 200); 
        scene.add(sun);

        // 地板改用 Standard 材質以接收光影
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(12000, 12000), 
            new THREE.MeshStandardMaterial({ 
                color: PersistedSettings.theme === 'light' ? 0xcccccc : 0x111111, 
                roughness: 0.6, metalness: 0.2 
            })
        ); 
        ground.rotation.x = -Math.PI / 2; 
        ground.receiveShadow = true; // 接收陰影
        scene.add(ground);
        
        const grid = new THREE.GridHelper(10000, 100, 0x00d4ff, PersistedSettings.theme === 'light' ? 0xbbbbbb : 0x222222); 
        grid.position.y = 0.05; scene.add(grid);
        
        // 邊界材質
        const border = new THREE.Mesh(new THREE.RingGeometry(WORLD_LIMIT, WORLD_LIMIT + 30, 64), new THREE.MeshBasicMaterial({ color: 0xff0000, side: THREE.DoubleSide })); border.rotation.x = -Math.PI / 2; border.position.y = 0.5; scene.add(border);

        createCheckpoints();
        p1 = createCar(1, p1Color); p2 = createCar(2, p2Color); 
        p1.pos.set(-80, 0, 0); p2.pos.set(80, 0, 0);
        scene.add(p1.mesh); scene.add(p2.mesh);

        document.getElementById('p1-arrow-path').setAttribute('fill', '#' + p1Color.toString(16).padStart(6,'0'));
        document.getElementById('p2-arrow-path').setAttribute('fill', '#' + p2Color.toString(16).padStart(6,'0'));
        window.addEventListener('resize', onWindowResize);
    }

    function createCheckpoints() {
        checkpoints = []; const range = 3200;
        const beamGeo = new THREE.CylinderGeometry(18, 18, 1200, 16), ringGeo = new THREE.RingGeometry(35, 65, 32);
        for (let i = 0; i < goalCount; i++) {
            const group = new THREE.Group();
            // 升級為發光材質
            const beam = new THREE.Mesh(beamGeo, new THREE.MeshStandardMaterial({ 
                color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.5, transparent: true, opacity: 0.7 
            }));
            beam.position.y = 600; group.add(beam);
            const ring = new THREE.Mesh(ringGeo, new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 1, side: THREE.DoubleSide })); 
            ring.rotation.x = -Math.PI/2; ring.position.y = 1.5; group.add(ring);
            
            group.position.set((Math.random()-0.5)*range*2, 0, (Math.random()-0.5)*range*2); scene.add(group);
            checkpoints.push({ mesh: group, beam, ring, pos: group.position.clone() });
        }
    }

    function createCar(id, color) {
        const group = new THREE.Group();
        // 升級車體材質 (PBR 金屬感)
        const body = new THREE.Mesh(
            new THREE.BoxGeometry(2.6, 1.0, 5.2), 
            new THREE.MeshStandardMaterial({ color, roughness: 0.2, metalness: 0.7 })
        );
        body.position.y = 0.6; 
        body.castShadow = true; // 產生陰影
        group.add(body);
        
        const cabin = new THREE.Mesh(
            new THREE.BoxGeometry(1.7, 0.7, 2), 
            new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.1, metalness: 0.9 })
        ); 
        cabin.position.set(0, 1.35, -0.25); 
        cabin.castShadow = true;
        group.add(cabin);

        // 加入專屬底盤霓虹點光源 (製造超讚動態陰影)
        const neonLight = new THREE.PointLight(color, 2, 150);
        neonLight.position.set(0, 5, 0); // 稍微拉高以投射車體陰影到地板
        neonLight.castShadow = true;
        neonLight.shadow.mapSize.width = 512;
        neonLight.shadow.mapSize.height = 512;
        neonLight.shadow.bias = -0.001;
        group.add(neonLight);

        const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 5500);
        return { id, mesh: group, camera, pos: new THREE.Vector3(), rot: 0, vel: 0, oobTimer: 0, targetIndex: 0, color: new THREE.Color(color), aiTargetRot: 0, aiNoiseSeed: Math.random()*1000, mistakeTimer: 0, lastMistakeOffset: new THREE.Vector3() };
    }

    function updateAIInput(p, delta) {
        if (p.targetIndex >= goalCount) return { up: false, down: false, left: false, right: false };
        const target = checkpoints[p.targetIndex].pos, toTarget = target.clone().sub(p.pos), dist = toTarget.length();
        p.mistakeTimer += delta;
        if (p.mistakeTimer > 1.2) { p.mistakeTimer = 0; const s = Math.min(1, dist/1000)*85; p.lastMistakeOffset.set((Math.random()-0.5)*s, 0, (Math.random()-0.5)*s); }
        const pt = target.clone().add(p.lastMistakeOffset).add(new THREE.Vector3(Math.sin(clock.elapsedTime*0.4)*40, 0, Math.cos(clock.elapsedTime*0.6)*40));
        const ir = Math.atan2(pt.x-p.pos.x, pt.z-p.pos.z);
        const dot = new THREE.Vector3(Math.sin(p.rot),0,Math.cos(p.rot)).dot(toTarget.clone().normalize());
        p.aiTargetRot = THREE.MathUtils.lerp(p.aiTargetRot, ir, (dot<0)?0.08:(dist<150?0.07:0.04));
        let rd = p.aiTargetRot - p.rot; while(rd > Math.PI) rd -= Math.PI*2; while(rd < -Math.PI) rd += Math.PI*2;
        const decelerate = (Math.abs(rd)>1.1 || dot<-0.4 || (dist<150 && p.vel > 90));
        return { up: !decelerate, down: decelerate, left: rd>0.07, right: rd<-0.07 };
    }

    function updatePhysics(p, delta) {
        if (isFinished || !gameRunning) return;
        const isAI = (gameMode === 3) || (gameMode === 1 && p.id === 2);
        let ctrl = isAI ? updateAIInput(p, delta) : { up: p.id===1?keys['KeyW']:keys['ArrowUp'], down: p.id===1?keys['KeyS']:keys['ArrowDown'], left: p.id===1?keys['KeyA']:keys['ArrowLeft'], right: p.id===1?keys['KeyD']:keys['ArrowRight'] };
        if (ctrl.up) p.vel += 1.8*delta*60; else if (ctrl.down) p.vel -= 1.5*delta*60; else p.vel *= 0.995;
        const sp = 0.022 * (Math.min(1, Math.abs(p.vel)/35) + 0.3);
        if (ctrl.left) p.rot += sp; if (ctrl.right) p.rot -= sp;
        p.pos.x += Math.sin(p.rot)*p.vel*delta*2; p.pos.z += Math.cos(p.rot)*p.vel*delta*2;
        p.mesh.position.copy(p.pos); p.mesh.rotation.y = p.rot;
        
        const warnBox = document.getElementById('warning-box');
        if (Math.abs(p.pos.x) > WORLD_LIMIT || Math.abs(p.pos.z) > WORLD_LIMIT) {
            if (p.id === 1 && gameMode !== 3) {
                warnBox.classList.add('show-warn'); p.oobTimer += delta;
                document.getElementById('warn-timer').innerText = Math.ceil(3.1-p.oobTimer);
                if (p.oobTimer >= 3) { teleport(p); p.oobTimer = 0; }
            } else teleport(p);
        } else if (p.id === 1) { warnBox.classList.remove('show-warn'); p.oobTimer = 0; }
        
        p.camera.fov = 70 + Math.min(45, (Math.abs(p.vel)/250)*45); p.camera.updateProjectionMatrix();
        const camOff = new THREE.Vector3(-Math.sin(p.rot)*32, 16, -Math.cos(p.rot)*32);
        p.camera.position.copy(p.pos).add(camOff); p.camera.lookAt(p.pos.clone().add(new THREE.Vector3(0,3,0)));
        const eng = p.id === 1 ? AudioEngine.p1Engine : AudioEngine.p2Engine;
        if (eng) AudioEngine.updateEngine(eng, p.vel);
        updateHUD(p); handleCollection(p);
    }

    function teleport(p) { p.pos.set((Math.random()-0.5)*WORLD_LIMIT*1.4, 0, (Math.random()-0.5)*WORLD_LIMIT*1.4); p.vel *= 0.1; p.aiTargetRot = p.rot; }

    function updateHUD(p) {
        document.getElementById(`p${p.id}-speed`).innerText = Math.round(Math.abs(p.vel*5.2));
        document.getElementById(`p${p.id}-collected`).innerText = p.targetIndex;
        if (p.targetIndex < goalCount) {
            const target = checkpoints[p.targetIndex].pos, arrow = document.querySelector(`#p${p.id}-nav svg`), ta = Math.atan2(target.x-p.pos.x, target.z-p.pos.z);
            arrow.style.transform = `rotate(${(ta-p.rot)*(180/Math.PI)}deg)`;
            
            const isSplit = gameMode !== 1;
            const mapSize = isPE ? 130 : (isSplit ? 140 : 180);
            const scale = (mapSize*0.8)/(WORLD_LIMIT*2);
            
            const setDot = (id, pos) => { 
                const el = document.getElementById(id); 
                if (el) { 
                    el.style.left = (pos.x*scale+mapSize/2)+'px'; 
                    el.style.top = (pos.z*scale+mapSize/2)+'px'; 
                }
            };
            const other = p.id === 1 ? p2 : p1;
            setDot(`p${p.id}-radar-self`, p.pos); setDot(`p${p.id}-radar-other`, other.pos); setDot(`p${p.id}-radar-target`, target);
        }
    }

    function handleCollection(p) { if (p.targetIndex < goalCount && p.pos.distanceTo(checkpoints[p.targetIndex].pos) < 75) { p.targetIndex++; AudioEngine.playCollectSFX(); if (p.targetIndex >= goalCount) checkEnd(); } }

    function checkEnd() {
        if (isFinished) return; isFinished = true;
        const totalTime = ((Date.now() - startTime)/1000).toFixed(2);
        const msg = (gameMode === 3) ? (p1.targetIndex >= goalCount ? "AI 1 獲勝" : "AI 2 獲勝") : (p1.targetIndex >= goalCount ? "玩家 1 獲勝" : (gameMode === 1 ? "模仿型 AI 獲勝" : "玩家 2 獲勝"));
        document.getElementById('win-title').innerText = msg;
        document.getElementById('win-msg').innerText = `玩家 1 核心：${p1.targetIndex}\n對手/AI 核心：${p2.targetIndex}\n競速總耗時：${totalTime}s`;
        document.getElementById('win-screen').style.display = 'flex';
    }

    function updateVisualsForViewport(viewer, other) {
        checkpoints.forEach((cp, idx) => {
            const oDone = (idx < other.targetIndex); cp.mesh.visible = (idx === viewer.targetIndex);
            if (cp.mesh.visible) {
                const mix = new THREE.Color().copy(viewer.color).lerp(other.color, 0.5);
                if (oDone) { 
                    cp.beam.material.color.copy(other.color); cp.beam.material.emissive.copy(other.color);
                    cp.ring.material.color.copy(other.color); cp.ring.material.emissive.copy(other.color);
                }
                else if (idx === other.targetIndex) { 
                    cp.beam.material.color.copy(mix); cp.beam.material.emissive.copy(mix);
                    cp.ring.material.color.copy(mix); cp.ring.material.emissive.copy(mix);
                }
                else { 
                    cp.beam.material.color.copy(viewer.color); cp.beam.material.emissive.copy(viewer.color);
                    cp.ring.material.color.copy(viewer.color); cp.ring.material.emissive.copy(viewer.color);
                }
            }
        });
    }

    function animate() {
        if (!gameRunning) return;
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        updatePhysics(p1, delta); updatePhysics(p2, delta);
        const w = window.innerWidth, h = window.innerHeight;
        const isSplit = gameMode !== 1;
        if (isSplit) {
            updateVisualsForViewport(p1, p2); renderer.setViewport(0, 0, w/2, h); renderer.setScissor(0, 0, w/2, h); renderer.setScissorTest(true); renderer.render(scene, p1.camera);
            updateVisualsForViewport(p2, p1); renderer.setViewport(w/2, 0, w/2, h); renderer.setScissor(w/2, 0, w/2, h); renderer.setScissorTest(true); renderer.render(scene, p2.camera);
        } else {
            updateVisualsForViewport(p1, p2); renderer.setViewport(0, 0, w, h); renderer.setScissorTest(false); renderer.render(scene, p1.camera);
        }
    }

    function startGame() {
        AudioEngine.init(); const menu = document.getElementById('start-menu'); menu.style.opacity = '0';
        setTimeout(() => {
            menu.style.display = 'none';
            // HUD 元素動態滑入
            document.querySelectorAll('.hud-element').forEach(el => {
                const id = el.id;
                if (gameMode === 1 && (id.includes('p2') || id === 'divider')) return;
                
                if (id === 'divider') el.style.display = 'block';
                else if (id === 'mobile-controls-wrapper' && isPE && gameMode !== 3) el.style.display = 'flex';
                else if (id !== 'mobile-controls-wrapper') el.style.display = 'block';

                // 稍微延遲讓 display: block 生效後再加 class 觸發動畫
                requestAnimationFrame(() => { el.classList.add('show'); });
            });
            document.getElementById('p1-total').innerText = goalCount;
            document.getElementById('p2-total').innerText = goalCount;
            document.getElementById('p1-speed').innerText = '0';
            document.getElementById('p2-speed').innerText = '0';
            isFinished = false; startTime = Date.now();
            initGame(); gameRunning = true; animate();
        }, 500);
    }

    function returnToMenu() {
        gameRunning = false;
        for (let k in keys) delete keys[k];
        if (renderer) {
            renderer.domElement.parentNode && renderer.domElement.parentNode.removeChild(renderer.domElement);
            renderer.dispose();
        }
        document.querySelectorAll('.hud-element').forEach(el => {
            el.classList.remove('show');
            setTimeout(() => el.style.display = 'none', 800);
        });
        document.getElementById('warning-box').classList.remove('show-warn');
        document.getElementById('win-screen').style.display = 'none';
        const menu = document.getElementById('start-menu');
        menu.style.display = 'flex';
        requestAnimationFrame(() => menu.style.opacity = '1');
        if (AudioEngine.p1Engine) { AudioEngine.p1Engine.gain.gain.value = 0; AudioEngine.p2Engine.gain.gain.value = 0; }
    }

    function onWindowResize() {
        if (!renderer || !p1) return;
        const w = window.innerWidth, h = window.innerHeight; renderer.setSize(w, h);
        const isSplit = gameMode !== 1;
        p1.camera.aspect = (isSplit?w/2:w)/h; p1.camera.updateProjectionMatrix();
        p2.camera.aspect = (w/2)/h; p2.camera.updateProjectionMatrix();
    }
</script>
</body>
